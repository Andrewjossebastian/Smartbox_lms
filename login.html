
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Payment Portal - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden">
    <div class="bg-indigo-600 p-6 text-center">
      <h1 class="text-3xl font-bold text-white">Smart Payment Portal</h1>
      <p class="text-indigo-200 mt-2">Secure Access Gateway</p>
    </div>

    <div class="p-8">
      <h2 class="text-xl font-semibold mb-6 text-gray-700 text-center">Please Log In</h2>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Identifier</label>
          <input id="login-identifier" type="text" placeholder="Admin Email or Student Name"
            class="w-full p-3 border border-gray-300 rounded-lg" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input id="login-password" type="password" placeholder="Password (Admin Only)"
            class="w-full p-3 border border-gray-300 rounded-lg" />
        </div>

        <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white p-3 rounded-lg hover:bg-indigo-700">
          Log In
        </button>
      </div>

      <p id="login-message" class="mt-4 text-center text-red-500 text-sm min-h-[20px]"></p>
    </div>

    <div class="bg-gray-50 p-4 text-center text-xs text-gray-400">Authorized Personnel Only</div>
  </div>

  <!-- Firebase Login Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const ADMIN_EMAIL = "walletidgroup@gmail.com";
    const ADMIN_PASSWORD = "walletid123@";

    const firebaseConfig = {
      apiKey: "AIzaSyAwCBtmPylGLPngM0CbPIE03zQ-Cg4SObM",
      authDomain: "smartpayment-98fc1.firebaseapp.com",
      databaseURL: "https://smartpayment-98fc1-default-rtdb.firebaseio.com",
      projectId: "smartpayment-98fc1",
      storageBucket: "smartpayment-98fc1.firebasestorage.app",
      messagingSenderId: "877837329158",
      appId: "1:877837329158:web:70bc5e3a9788df150f7487",
      measurementId: "G-KJ24HEY56S"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const rtdb = getDatabase(app);

    window.handleLogin = async () => {
      const id = document.getElementById("login-identifier").value.trim();
      const pw = document.getElementById("login-password").value.trim();
      const msg = document.getElementById("login-message");

      if (!id) return (msg.textContent = "Please enter an identifier.");

      msg.textContent = "Verifying...";

      if (id === ADMIN_EMAIL) {
        try {
          await signInWithEmailAndPassword(auth, id, pw);
          window.location.href = "dashboard.html?role=admin";
          return;
        } catch (e) {
          msg.textContent = "Admin login failed.";
          return;
        }
      }

      if (pw === "" || pw === ADMIN_PASSWORD) {
        try {
          const snap = await get(ref(rtdb, "student"));
          if (snap.exists()) {
            const data = snap.val();
            const match = Object.keys(data).find(
              (n) => n.toLowerCase() === id.toLowerCase()
            );

            if (match) {
              const uid = data[match];
              window.location.href = `dashboard.html?role=student&name=${match}&uid=${uid}`;
              return;
            }
          }
          msg.textContent = "Student not found.";
        } catch (e) {
          msg.textContent = "Connection error.";
        }
      } else {
        msg.textContent = "Invalid login.";
      }
    };
  </script>
</body>
</html>
